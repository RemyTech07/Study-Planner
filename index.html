<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0a10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>300L Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a10;--bg-rgb:13,10,16;--card-rgb:30,22,34;--card2-rgb:44,32,48;--panel-rgb:20,15,24;--inset-rgb:16,12,20;--sheet-rgb:26,19,30;--acc:#ff6b8b;--acc-rgb:255,107,139;--acc-l:#ffb3c3;--acc2:#ffb454;--acc2-rgb:255,180,84;--g1:#ff5f8f;--g2:#ff8a4c;--g2-rgb:255,138,76;--on:#fff;--gl1:#9d174d;--gl2:#c2410c;--gl3:#6b21a8;--card:rgba(var(--card-rgb),.72);--card2:rgba(var(--card2-rgb),.6);--line:rgba(148,163,184,.13);--line2:rgba(148,163,184,.22);--ink:#ece9f2;--mute:#9a93a8;--dim:#6a6378;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);transition:background .6s;color:var(--ink);font:14.5px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,.disp{font-family:Outfit,Inter,sans-serif;margin:0;letter-spacing:-.01em}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
/* glowing background */
.glow{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.glow i{position:absolute;border-radius:50%;transition:background 1.2s;filter:blur(90px);opacity:.33;animation:drift 28s ease-in-out infinite alternate}
.glow i:nth-child(1){width:520px;height:520px;background:var(--gl1);top:-160px;left:-120px}
.glow i:nth-child(2){width:460px;height:460px;background:var(--gl2);bottom:-180px;right:-120px;animation-duration:34s}
.glow i:nth-child(3){width:380px;height:380px;background:var(--gl3);top:40%;left:45%;opacity:.18;animation-duration:40s}
@keyframes drift{to{transform:translate(80px,60px) scale(1.15)}}
.glow::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(to bottom,#000,transparent 70%)}
/* layout */
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:rgba(var(--panel-rgb),.55);backdrop-filter:blur(14px)}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.logo .bolt{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g1),var(--acc2));color:#0b1020;box-shadow:0 0 24px rgba(var(--acc-rgb),.45);animation:pulse 3.5s ease-in-out infinite}
.logo .bolt svg{width:22px;height:22px;stroke-width:2.4}
@keyframes pulse{50%{box-shadow:0 0 36px rgba(var(--acc2-rgb),.55)}}
.logo b{font-family:Outfit,Inter,sans-serif;font-size:18px;display:block;line-height:1.1}.logo small{color:var(--mute);font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--mute);text-decoration:none;font-weight:500;transition:background .2s,color .2s,transform .2s}
.nav a:hover{background:rgba(var(--acc-rgb),.08);color:var(--ink);transform:translateX(3px)}
.nav a.on{background:linear-gradient(90deg,rgba(var(--acc-rgb),.2),rgba(var(--acc-rgb),.04));color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.nav a.on svg{color:var(--acc)}
.side .foot{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card2);font-size:12.5px}
.sync{display:flex;align-items:center;gap:8px;color:var(--mute)}
.sync .d{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync.ok .d{background:var(--ok);box-shadow:0 0 10px var(--ok)}.sync.saving .d{background:var(--warn);animation:blink 1s infinite}.sync.warn .d{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}
.mainw{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:16px 32px;background:rgba(var(--bg-rgb),.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{font-size:22px;font-weight:700;margin-right:auto;display:flex;align-items:center;gap:10px}
.wnav{display:flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px}
.wnav button.ar{width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--mute);display:grid;place-items:center;transition:background .2s,color .2s}
.wnav button.ar:hover{background:rgba(var(--acc-rgb),.15);color:#fff}
.wk{padding:0 12px;text-align:center;min-width:190px;line-height:1.2}
.wk b{font-family:Outfit,Inter,sans-serif;font-size:15px}.wk small{display:block;color:var(--mute);font-size:12px}
.tbtn{border:1px solid var(--line2);background:transparent;border-radius:12px;padding:8px 14px;color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:all .2s}
.tbtn:hover{border-color:var(--acc);color:#fff;background:rgba(var(--acc-rgb),.1)}
main{padding:28px 32px 110px;max-width:1500px;width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}
.t-lecture{background:rgba(var(--acc-rgb),.16);color:var(--acc-l)}.t-break{background:rgba(52,211,153,.15);color:#6ee7b7}.t-revision{background:rgba(251,191,36,.15);color:#fcd34d}.t-exam{background:rgba(251,113,133,.16);color:#fda4af}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;backdrop-filter:blur(10px);position:relative}
.card h2{font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.card h2 .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(var(--acc-rgb),.14);color:var(--acc)}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.btn{border:1px solid var(--line2);background:var(--card2);border-radius:11px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:all .18s}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:var(--on);box-shadow:0 6px 20px rgba(var(--g2-rgb),.35)}
.btn.pri:hover{box-shadow:0 8px 26px rgba(var(--g2-rgb),.5)}
.btn.danger{color:var(--bad);border-color:rgba(251,113,133,.35)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:9px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:9px;color:var(--mute);display:inline-flex;align-items:center;gap:6px;font-weight:500;transition:all .2s}
.seg button.on{background:rgba(var(--acc-rgb),.2);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12.5px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.chip b{color:var(--ink)}
.muted{color:var(--mute)}
.note{display:flex;gap:10px;align-items:flex-start;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);color:#fde68a;border-radius:14px;padding:12px 16px;margin-bottom:20px;font-size:13.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin:0 0 16px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
/* entrance animation */
.anim .rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
/* week grid */
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:rgba(var(--panel-rgb),.7);max-height:calc(100vh - 250px)}
.grid{display:grid;grid-template-columns:62px repeat(7,minmax(150px,1fr));min-width:1120px;position:relative}
.dh{position:sticky;top:0;z-index:4;background:rgba(var(--panel-rgb),.96);border-bottom:1px solid var(--line);padding:12px 8px;text-align:center}
.dh b{font-family:Outfit,Inter,sans-serif;font-size:14px;display:block}.dh small{color:var(--mute);font-size:12px}
.dh.today b{color:var(--acc)}.dh.today small{background:var(--acc);color:#0b1020;border-radius:99px;padding:1px 8px;font-weight:700}
.times{position:relative;border-right:1px solid var(--line)}
.times span{position:absolute;right:10px;font-size:11.5px;color:var(--dim);transform:translateY(-50%)}
.daycol{position:relative;border-right:1px solid var(--line);background-image:linear-gradient(to bottom,rgba(148,163,184,.08) 1px,transparent 1px)}
.daycol:last-child{border-right:0}
.daycol.today{background-color:rgba(var(--acc-rgb),.04)}
.daycol.drop{background-color:rgba(var(--acc-rgb),.12)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3;pointer-events:none;box-shadow:0 0 10px var(--bad)}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(251,113,133,.7)}100%{box-shadow:0 0 0 10px rgba(251,113,133,0)}}
.blk{position:absolute;border-radius:12px;padding:7px 9px;overflow:hidden;font-size:12px;line-height:1.3;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .18s,box-shadow .18s,filter .18s;border:1px solid transparent}
.blk:hover{transform:translateY(-2px) scale(1.015);z-index:5;box-shadow:0 10px 28px rgba(0,0,0,.45);filter:brightness(1.08)}
.blk .hd{display:flex;align-items:center;gap:5px;font-size:11px;opacity:.85;font-weight:500}
.blk .hd svg{width:13px;height:13px}
.blk b{display:block;font-weight:600;font-size:12.8px;margin-top:2px}
.blk .tp{display:block;margin-top:4px;opacity:.78;font-size:11.3px}
.blk.solid{color:#0b1020}
.blk.solid .tp{opacity:.75}
.blk.tent{border-style:dashed!important;border-width:1.5px!important}
.blk.cancel{opacity:.3;filter:grayscale(1)}
.blk.cancel b{text-decoration:line-through}
.blk.dragging{opacity:.25}
.tag{display:inline-block;font-size:9.5px;font-weight:800;padding:0 5px;border-radius:5px;background:rgba(0,0,0,.25);letter-spacing:.04em}
.ghost{position:fixed;pointer-events:none;z-index:200;opacity:.95;box-shadow:0 18px 40px rgba(0,0,0,.6);transform:rotate(-1.5deg) scale(1.03)!important}
.droplabel{position:fixed;z-index:201;pointer-events:none;background:#fff;color:#0b1020;font-weight:600;font-size:12.5px;padding:5px 10px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
/* day view */
.daypick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.daypick button{flex:1;min-width:64px;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:9px 6px;text-align:center;color:var(--mute);transition:all .2s}
.daypick button b{display:block;font-family:Outfit,Inter,sans-serif;font-size:18px;color:var(--ink)}
.daypick button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:rgba(255,255,255,.85);border-color:transparent;box-shadow:0 6px 18px rgba(var(--g2-rgb),.4)}
.daypick button.on b{color:#fff}
.daypick button.td:not(.on){border-color:var(--acc)}
.dayline{display:grid;grid-template-columns:64px 1fr;border:1px solid var(--line);border-radius:var(--r);background:rgba(var(--panel-rgb),.7);overflow:hidden}
.dayline .daycol{border-right:0}
/* list rows */
.agenda .row{display:flex;gap:14px;align-items:flex-start;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;transition:background .2s;border-radius:10px}
.agenda .row:first-child{border-top:0}
.agenda .row:hover{background:rgba(var(--acc-rgb),.06)}
.agenda .tm{width:118px;flex:none;color:var(--mute);font-size:12.5px;padding-top:7px}
.agenda .ib{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.agenda .row.cancel{opacity:.4}.agenda .row.cancel b{text-decoration:line-through}
.agenda .row.live{background:rgba(var(--acc-rgb),.1)}
.agenda .tx{flex:1;min-width:0}
.agenda .tx small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.daycard{margin-bottom:18px}
.daycard h3{font-size:16px;margin-bottom:6px;display:flex;align-items:baseline;gap:8px}
/* checklist items */
.item{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-top:1px solid var(--line);transition:opacity .3s}
.item:first-of-type{border-top:0}
.item .tx{flex:1;min-width:0;overflow-wrap:anywhere;transition:color .3s}
.item.done .tx{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(138,150,176,.5)}
.item select,.sel{font-size:12.5px;border:1px solid var(--line2);border-radius:9px;padding:4px 8px;max-width:148px;background:rgb(var(--inset-rgb));color:var(--ink)}
input.ck{appearance:none;-webkit-appearance:none;width:21px;height:21px;border-radius:7px;border:2px solid #4b5875;flex:none;margin:1px 0 0;cursor:pointer;display:grid;place-items:center;transition:all .2s;background:transparent}
input.ck:hover{border-color:var(--acc)}
input.ck:checked{background:var(--ok);border-color:var(--ok);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
input.ck:checked::after{content:"";width:11px;height:6px;border:2.5px solid #052e1f;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.x{border:0;background:none;color:var(--dim);padding:2px;border-radius:7px;display:grid;place-items:center;transition:all .2s}
.x:hover{color:var(--bad);background:rgba(251,113,133,.12)}
.x.ed:hover{color:var(--acc);background:rgba(var(--acc-rgb),.12)}
.sugg{font-size:10px;color:var(--warn);font-weight:700;margin-left:6px;letter-spacing:.05em}
.prog{height:8px;background:rgba(148,163,184,.12);border-radius:9px;overflow:hidden;margin:8px 0 14px}
.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ok),#5eead4);box-shadow:0 0 12px rgba(52,211,153,.5)}
.anim .prog i{animation:grow 1s cubic-bezier(.2,.8,.2,1) both .15s}
@keyframes grow{from{width:0}}
.add{display:flex;gap:8px;margin-top:14px}
.add input[type=text]{flex:1;min-width:0;border:1px solid var(--line2);border-radius:11px;padding:9px 12px;background:rgba(var(--inset-rgb),.6);outline:none;transition:border .2s,box-shadow .2s}
.add input[type=text]:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.18)}
.cgrp{display:flex;align-items:center;gap:9px;margin:18px 0 6px;font-family:Outfit,Inter,sans-serif;font-weight:600;font-size:15px}
.cgrp:first-of-type{margin-top:6px}
.over{border-color:rgba(251,113,133,.35);background:linear-gradient(180deg,rgba(251,113,133,.08),var(--card))}
textarea{width:100%;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;min-height:66px;resize:vertical;background:rgba(var(--inset-rgb),.6);outline:none}
textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.18)}
label.f{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute);margin:16px 0 6px;font-weight:600}
.courseh{display:flex;align-items:center;gap:12px}
.cbadge{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-family:Outfit,Inter,sans-serif;font-weight:800;font-size:13px;color:#0b1020;flex:none}
.colorpick{width:30px;height:30px;border:0;padding:0;background:none;border-radius:9px;cursor:pointer;margin-left:auto}
.colorpick::-webkit-color-swatch-wrapper{padding:0}.colorpick::-webkit-color-swatch{border:2px solid var(--line2);border-radius:9px}
.tips{font-size:12.5px;color:var(--mute);background:rgba(var(--acc-rgb),.06);border-radius:11px;padding:9px 12px;margin:12px 0 4px;display:flex;gap:8px}
table.wks{width:100%;border-collapse:collapse;font-size:13.5px}
table.wks td,table.wks th{padding:10px 8px;border-top:1px solid var(--line);text-align:left}
table.wks th{color:var(--mute);font-weight:600;font-size:12px;border-top:0}
table.wks tr.cur td{background:rgba(var(--acc-rgb),.08)}
table.wks a{color:var(--ink);font-weight:600;text-decoration:none}
/* home */
.hero{display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:28px;background:linear-gradient(135deg,rgba(var(--g2-rgb),.28),rgba(var(--acc2-rgb),.12) 60%,rgba(var(--card-rgb),.6));overflow:hidden}
.hero h2{font-size:30px;font-weight:800;margin-bottom:6px}
.hero .wave{display:inline-block;animation:wave 2.2s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}}
.rings{display:flex;gap:22px;flex-wrap:wrap}
.ring{text-align:center;font-size:12px;color:var(--mute)}
.ring svg{width:96px;height:96px;transform:rotate(-90deg);display:block;margin:0 auto 6px}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(148,163,184,.15)}
.ring .fg{stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:calc(var(--c) * (1 - var(--p)));transition:stroke-dashoffset 1s}
.anim .ring .fg{animation:ringin 1.3s cubic-bezier(.2,.8,.2,1) both .2s}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
.ring .val{position:relative;margin-top:-66px;height:60px;font-family:Outfit,Inter,sans-serif;font-size:21px;font-weight:700;color:var(--ink)}
.upnext{display:flex;gap:16px;align-items:center}
.upnext .big{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;flex:none;animation:float 4s ease-in-out infinite}
.upnext .big svg{width:28px;height:28px}
@keyframes float{50%{transform:translateY(-5px)}}
.count{font-family:Outfit,Inter,sans-serif;font-size:13px;font-weight:600;color:var(--acc2);display:flex;align-items:center;gap:6px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:ping2 1.5s infinite}
@keyframes ping2{0%{box-shadow:0 0 0 0 rgba(52,211,153,.7)}100%{box-shadow:0 0 0 9px rgba(52,211,153,0)}}
.cprog{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;font-size:13px}
.cprog .prog{margin:0}
.focus{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.focus:first-of-type{border-top:0}
.focus .ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:22px;text-align:center;color:var(--mute)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(3,6,14,.65);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto;animation:fade .2s}
.modal.hidden{display:none}
@keyframes fade{from{opacity:0}}
.sheet{background:rgb(var(--sheet-rgb));border:1px solid var(--line2);border-radius:22px;max-width:540px;width:100%;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:zoom .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes zoom{from{opacity:0;transform:scale(.94) translateY(10px)}}
.sheet h2{font-size:20px;margin-bottom:6px}
.sheet input[type=text],.sheet input[type=time],.sheet input[type=date],.sheet select{width:100%;border:1px solid var(--line2);border-radius:11px;padding:9px 12px;background:rgba(var(--inset-rgb),.7);color-scheme:dark}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.checks{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;align-items:center}
.checks label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
#toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);background:#f1f5ff;color:#0b1020;font-weight:600;padding:11px 18px;border-radius:13px;font-size:13.5px;opacity:0;transition:all .3s cubic-bezier(.2,.9,.3,1.3);pointer-events:none;z-index:300;display:flex;gap:8px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:400;animation:fly .9s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;outline:none}
.sw:hover{transform:scale(1.15)}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink);transform:scale(1.08)}
.themebig .sw{width:auto;height:auto;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:600;background:var(--card2);border:1px solid var(--line)}
.themebig .sw i{width:22px;height:22px;border-radius:50%;display:block}
.themebig .sw.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.25)}
/* bottom nav (mobile) */
.bnav{display:none}
@media (max-width:900px){
  .side{display:none}
  .topbar{padding:12px 14px;gap:8px}.topbar h1{font-size:18px;width:100%}
  .wnav{flex:1}.wk{flex:1;min-width:0}
  main{padding:16px 14px 100px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .card{min-width:0}.item select{max-width:112px}.add .sel{max-width:112px}
  .card{padding:18px}
  .hero{padding:22px}.hero h2{font-size:24px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(var(--inset-rgb),.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);text-decoration:none;font-size:10.5px;font-weight:600;padding:6px 0;border-radius:12px;transition:color .2s}
  .bnav a.on{color:#fff}.bnav a.on svg{color:var(--acc);transform:translateY(-2px)}
  .bnav a svg{width:22px;height:22px;transition:transform .25s}
  .agenda .tm{width:84px}
  .rings{gap:8px;justify-content:space-between;width:100%}
  .ring svg{width:80px;height:80px}.ring .val{margin-top:-58px;height:52px;font-size:17px}
  .bar .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px}.chip{white-space:nowrap}
  .legend{display:none}
  .gridwrap{max-height:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- dates ---------- */
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fD=d=>d.getDate()+' '+MON[d.getMonth()];
const wStart=i=>addD(parseD(S.settings.start),7*i);
function wRange(i){const a=wStart(i),b=addD(a,6);return fD(a)+' – '+fD(b)}
const toM=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const toT=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function f12(m){let h=Math.floor(m/60),mm=m%60,ap=h>=12?'pm':'am';h=h%12||12;return h+(mm?':'+String(mm).padStart(2,'0'):'')+ap}
const fR=(s,e)=>f12(toM(s))+' – '+f12(toM(e));
function typeOrd(i){const t=S.weeks[i].type;let n=0;for(let k=0;k<=i;k++)if(S.weeks[k].type===t)n++;return n}
function wLabel(i){if(!S.weeks[i])return'?';return({lecture:'Week ',break:'Break ',revision:'Revision ',exam:'Exams '})[S.weeks[i].type]+typeOrd(i)}
function wIdx(){const m={};S.weeks.forEach((w,i)=>m[w.id]=i);return m}
function currentWeek(){const t=new Date();t.setHours(0,0,0,0);for(let i=0;i<S.weeks.length;i++){const a=wStart(i);if(t>=a&&t<addD(a,7))return i}return t<wStart(0)?0:S.weeks.length-1}
function todayDay(i){const t=new Date();t.setHours(0,0,0,0);const d=Math.round((t-wStart(i))/864e5);return d>=0&&d<7?d:-1}
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};

/* ---------- storage ---------- */
let backend='local',db=null,readonly=false;const timers={},writing={},again={};
function setStatus(k,txt){const el=$('#sync');el.className='sync '+k;$('#synctx').textContent=txt}
function cacheLocal(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
function save(...keys){S._savedAt=Date.now();cacheLocal();if(readonly){setStatus('warn','Read-only');return}
  if(backend==='gist'){schedPush();return}
  if(backend!=='db'){setStatus('warn','Saved on this device only');return}
  setStatus('saving','Saving…');
  for(const k of keys){clearTimeout(timers[k]);timers[k]=setTimeout(()=>{timers[k]=null;flush(k)},650)}}
async function flush(k){if(writing[k]){again[k]=true;return}writing[k]=true;
  try{await db.doc(DOCS[k]).set({[k]:clone(S[k]),updated:Date.now()})}
  catch(e){if(e&&e.code==='invalid_argument'){readonly=true;setStatus('warn','Read-only')}
    else if(e&&e.code==='unavailable')setTimeout(()=>flush(k),800+Math.random()*800);
    else setStatus('warn','Couldn’t save ('+(e&&e.code||'error')+')')}
  writing[k]=false;if(again[k]){again[k]=false;flush(k);return}
  if(!readonly&&!Object.values(writing).some(Boolean)&&!Object.values(timers).some(Boolean))setStatus('ok','Synced to your account')}
async function connect(){let d=null;try{d=window.claude&&await window.claude.use('db')}catch(e){}
  if(!d){backend='local';if(G.token)connectGist();else setStatus('warn','Saved on this device only');return}
  db=d;backend='db';setStatus('saving','Loading your plan…');
  const lt=setTimeout(()=>setStatus('warn','Can’t reach saved data yet'),10000);
  for(const k of Object.keys(DOCS)){try{db.doc(DOCS[k]).onSnapshot(snap=>{
      if(!snap.metadata.fromCache)clearTimeout(lt);
      if(timers[k]||writing[k]||snap.metadata.hasPendingWrites)return;
      if(snap.exists){const v=snap.data()[k];if(v!=null){S[k]=clone(v);cacheLocal();schedRender()}}
      if(!snap.metadata.fromCache&&!Object.values(timers).some(Boolean)&&!readonly)setStatus('ok','Synced to your account');
    },err=>{clearTimeout(lt);setStatus('warn','Sync paused ('+err.code+')')})}catch(e){}}}


/* ---------- GitHub Gist sync (hosted version) ---------- */
const SYK='eee300-sync',GFILE='300l-planner.json',GH='https://api.github.com';
const G={token:'',id:'',busy:false,dirty:false,t:null,lastPull:0,user:''};
try{Object.assign(G,JSON.parse(localStorage.getItem(SYK)||'{}'));G.busy=false;G.dirty=false;G.t=null}catch(e){}
function saveCfg(){try{localStorage.setItem(SYK,JSON.stringify({token:G.token,id:G.id,user:G.user}))}catch(e){}}
async function gh(path,opt){opt=opt||{};const r=await fetch(GH+path,Object.assign({},opt,{cache:'no-store',headers:Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+G.token},opt.body?{'Content-Type':'application/json'}:{})}));
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}return r.status===204?null:r.json()}
function payload(){return JSON.stringify({app:'300l-planner',savedAt:S._savedAt||0,data:S})}
async function findGist(){for(let p=1;p<=5;p++){const l=await gh('/gists?per_page=100&page='+p);for(const g of l)if(g.files&&g.files[GFILE])return g.id;if(l.length<100)break}return''}
async function pullGist(){const g=await gh('/gists/'+G.id);const f=g.files&&g.files[GFILE];if(!f)throw new Error('missing file');
  let txt=f.content;if(f.truncated){txt=await(await fetch(f.raw_url,{cache:'no-store'})).text()}return JSON.parse(txt)}
async function pushGist(){if(G.busy){G.dirty=true;return}G.busy=true;G.dirty=false;setStatus('saving','Syncing…');
  try{await gh('/gists/'+G.id,{method:'PATCH',body:JSON.stringify({files:{[GFILE]:{content:payload()}}})});setStatus('ok','Synced · GitHub')}
  catch(e){setStatus('warn',e.status===401?'Sync token rejected':'Offline – will retry');if(e.status!==401){G.dirty=true;setTimeout(()=>{if(G.dirty)pushGist()},15000)}}
  G.busy=false;if(G.dirty)pushGist()}
function schedPush(){setStatus('saving','Syncing…');clearTimeout(G.t);G.t=setTimeout(()=>{G.t=null;pushGist()},1500)}
async function reconcile(quiet){if(backend!=='gist'||G.busy||G.t)return;
  try{const r=await pullGist();G.lastPull=Date.now();const rs=r.savedAt||0,ls=S._savedAt||0;
    if(rs>ls&&r.data&&r.data.weeks){S=Object.assign(clone(PLAN),r.data);cacheLocal();render(false);if(!quiet)toast('Updated from your other device','reset');setStatus('ok','Synced · GitHub')}
    else if(ls>rs)pushGist();else setStatus('ok','Synced · GitHub')}
  catch(e){setStatus('warn',e.status===401?'Sync token rejected':'Offline – saved on device')}}
async function connectGist(manual){setStatus('saving','Connecting to GitHub…');
  try{const u=await gh('/user');G.user=u.login||'';
    if(!G.id)G.id=await findGist();
    if(!G.id){const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'300L Study Planner data (synced by the app)',public:false,files:{[GFILE]:{content:payload()}}})});G.id=g.id}
    saveCfg();backend='gist';await reconcile(!manual);if(manual){toast('Sync is on for this device','check');render(false)}}
  catch(e){if(e.status!==401&&G.id&&!manual){backend='gist';setStatus('warn','Offline – will sync later');return false}backend='local';setStatus('warn',e.status===401?'Token not accepted':'Couldn’t reach GitHub');if(manual)toast(e.status===401?'That token was rejected – check it has the “gist” scope':'Couldn’t reach GitHub – check your connection','info');return false}
  return true}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&backend==='gist'&&Date.now()-G.lastPull>8000)reconcile(false)});
window.addEventListener('focus',()=>{if(backend==='gist'&&Date.now()-G.lastPull>8000)reconcile(false)});
setInterval(()=>{if(backend==='gist'&&document.visibilityState==='visible')reconcile(false)},90000);
window.addEventListener('pagehide',()=>{if(backend==='gist'&&(G.t||G.dirty)){try{fetch(GH+'/gists/'+G.id,{method:'PATCH',keepalive:true,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+G.token,'Content-Type':'application/json'},body:JSON.stringify({files:{[GFILE]:{content:payload()}}})})}catch(e){}}});

/* ---------- model ---------- */
const course=c=>S.courses.find(x=>x.code===c);
function blocksFor(i){const w=S.weeks[i];if(!w)return[];const ord=typeOrd(i),out=[];
  for(const b of S.blocks){if(!(b.modes||[]).includes(w.type))continue;if(b.freq==='biweekly'&&((ord-1)%2)!==(b.parity||0))continue;
    const o=(w.overrides||{})[b.id];
    if(o&&o.cancelled){out.push(Object.assign({},b,{cancelled:true,src:'tpl',key:'tpl:'+b.id}));continue}
    out.push(Object.assign({},b,o||{},{src:'tpl',changed:!!o,key:'tpl:'+b.id}))}
  for(const x of(w.extra||[]))out.push(Object.assign({},x,{src:'extra',key:'extra:'+x.id}));return out}
const findKey=(key,i)=>blocksFor(i).find(b=>b.key===key);
function blockTopics(b,i){if(!b.course)return null;const c=course(b.course);if(!c)return null;const w=S.weeks[i],idx=wIdx();
  if(w.type==='revision'||w.type==='exam'){const o=c.topics.filter(t=>!t.done).length;return{text:o?o+' topic'+(o>1?'s':'')+' not ticked':'All topics ticked ✓'}}
  if(w.type==='break'){const o=c.topics.filter(t=>!t.done&&idx[t.week]!=null&&idx[t.week]<i).length;return{text:o?o+' overdue topic'+(o>1?'s':''):'Nothing overdue ✓'}}
  const ts=c.topics.filter(t=>t.week===w.id);if(ts.length)return{list:ts};
  let best=null;for(const t of c.topics){const k=idx[t.week];if(k!=null&&k<i&&(!best||k>=idx[best.week]))best=t}return best?{cont:best}:null}
function topicLine(b,i){const r=blockTopics(b,i);if(!r)return'';if(r.text)return esc(r.text);if(r.cont)return'↳ '+esc(r.cont.t);return r.list.map(t=>(t.done?'✓ ':'')+esc(t.t)).join(' · ')}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function rgba(h,a){const[r,g,b]=hex2rgb(h);return`rgba(${r},${g},${b},${a})`}
function bColor(b){const c=b.course&&course(b.course);return c?c.color:(KCOL[b.kind]||'#94a3b8')}
const isSolid=b=>['class','lab','exam'].includes(b.kind);
function bStyle(b){const col=bColor(b);
  if(isSolid(b))return`background:linear-gradient(150deg,${col},${rgba(col,.78)});border-color:${col}`;
  return`background:linear-gradient(150deg,${rgba(col,.2)},${rgba(col,.08)});border-color:${rgba(col,.45)};box-shadow:inset 3px 0 0 ${col}`}
function icoBox(b,size){const col=bColor(b);return`<span class="ib" style="background:${rgba(col,.16)};color:${col}${size?';width:'+size+'px;height:'+size+'px':''}">${ico(KICON[b.kind]||'book')}</span>`}

let rT=null;function schedRender(){clearTimeout(rT);rT=setTimeout(()=>render(false),60)}

  ui.week=Math.max(0,Math.min(ui.week,S.weeks.length-1));const w=S.weeks[ui.week];

  v.innerHTML=ui.tab==='home'?rHome():ui.tab==='timetable'?rTimetable():ui.tab==='checklist'?rChecklist():ui.tab==='topics'?rTopics():rSemester();

  if(ui.tab==='timetable'){placeNow();const gw=$('.gridwrap');if(gw&&animate){gw.scrollTop=Math.max(0,(8*60-H0)*ppm()-20)}}
}
const ppm=()=>ui.view==='day'?1.3:1.1;
function placeNow(){document.querySelectorAll('.now').forEach(n=>n.remove());const td=todayDay(ui.week);if(td<0)return;const m=nowMin();if(m<H0||m>H1)return;
  const col=document.querySelector(ui.view==='day'?(ui.day===td?'.dayline .daycol':null):`.grid .daycol[data-day="${td}"]`);if(!col)return;
  const n=document.createElement('div');n.className='now';n.style.top=((m-H0)*ppm())+'px';col.appendChild(n)}
setInterval(()=>{if(ui.tab==='timetable')placeNow()},60000);

/* home */
function nextBlock(){const now=new Date();let ci=currentWeek();
  for(let i=ci;i<Math.min(S.weeks.length,ci+2);i++){const list=blocksFor(i).filter(b=>!b.cancelled);let best=null;
    for(const b of list){const base=addD(wStart(i),b.day);const s=new Date(base);s.setHours(0,toM(b.start));const e=new Date(base);e.setHours(0,toM(b.end));
      if(e>now&&(!best||s<best.s))best={b,s,e,i}}
    if(best)return best}return null}
function rel(ms){const m=Math.round(ms/60000);if(m<60)return m+' min';const h=Math.floor(m/60);if(h<24)return h+'h '+(m%60?m%60+'m':'');const d=Math.floor(h/24);return d+' day'+(d>1?'s':'')+' '+(h%24?h%24+'h':'')}
function ring(p,label,val,col){const c=2*Math.PI*40;return`<div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="40"/><circle class="fg" cx="50" cy="50" r="40" style="--c:${c.toFixed(1)};--p:${Math.max(0,Math.min(1,p))};stroke:${col}"/></svg><div class="val">${val}</div>${label}</div>`}
function rHome(){const ci=currentWeek(),w=S.weeks[ui.week],h=new Date().getHours();
  const greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  let tot=0,dn=0;S.courses.forEach(c=>{tot+=c.topics.length;dn+=c.topics.filter(t=>t.done).length});
  const{bw,tpl}=weekTasks(ui.week);const tt=tpl.length+bw.custom.length,td=tpl.filter(t=>bw.done[t.id]).length+bw.custom.filter(t=>t.done).length;
  const wt=S.courses.reduce((n,c)=>n+c.topics.filter(t=>t.week===w.id).length,0),wd=S.courses.reduce((n,c)=>n+c.topics.filter(t=>t.week===w.id&&t.done).length,0);

function summary(list){const sum={};for(const b of list){if(b.cancelled||['church','personal'].includes(b.kind))continue;const d=(toM(b.end)-toM(b.start))/60;const k=isSolid(b)?'class':b.kind;sum[k]=(sum[k]||0)+d}
  const L={class:'Classes',study:'Study',career:'Career',sport:'Basketball',misc:'Misc',review:'Review'};
  return Object.entries(sum).map(([k,v])=>`<span class="chip">${ico(KICON[k]||'book')}${L[k]||k} <b>${+v.toFixed(1)}h</b></span>`).join('')}
function blkHTML(b,i,P,extraStyle){const s=Math.max(H0,toM(b.start)),e=Math.min(H1,toM(b.end));if(e<=s)return'';
  const top=(s-H0)*P,hh=Math.max(22,(e-s)*P-4),W=100/b._n,tl=topicLine(b,i);
  const tags=(b.src==='extra'?'<span class="tag">THIS WK</span>':'')+(b.changed?'<span class="tag">MOVED</span>':'')+(b.tentative?'<span class="tag">TBC</span>':'');
  return`<div class="blk ${isSolid(b)?'solid':''} ${b.tentative?'tent':''} ${b.cancelled?'cancel':''}" data-key="${b.key}" title="${esc(b.title+' · '+fR(b.start,b.end)+(b.note?' · '+b.note:''))}" style="${bStyle(b)};top:${top+2}px;height:${hh}px;left:calc(${b._l*W}% + 4px);width:calc(${W}% - 8px)${extraStyle||''}">
  <span class="hd">${ico(KICON[b.kind]||'book')}${fR(b.start,b.end)} ${tags}</span><b>${esc(b.title)}</b>${tl&&hh>64?`<span class="tp">${tl}</span>`:''}${ui.view==='day'&&b.note&&hh>90?`<span class="tp">📝 ${esc(b.note)}</span>`:''}</div>`}
function timesCol(P){let h=`<div class="times" style="height:${(H1-H0)*P}px">`;for(let m=H0+60;m<H1;m+=60)h+=`<span style="top:${(m-H0)*P}px">${f12(m)}</span>`;return h+'</div>'}

function agRow(b,i){const tl=topicLine(b,i);return`<div class="row ${b.cancelled?'cancel':''}" data-edit="${b.key}"><div class="tm">${fR(b.start,b.end)}</div>${icoBox(b)}<div class="tx"><b>${esc(b.title)}</b>${b.tentative?' <span class="pill t-revision">TBC</span>':''}${b.src==='extra'?' <span class="pill t-break">this week</span>':''}${b.changed?' <span class="pill t-lecture">moved</span>':''}${tl?`<small>${tl}</small>`:''}${b.note?`<small>📝 ${esc(b.note)}</small>`:''}</div></div>`}
function lanes(items){items.sort((a,b)=>toM(a.start)-toM(b.start)||toM(b.end)-toM(a.end));let cl=[],end=-1;const all=[];

let modalCb=null,editing=null;
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.remove('hidden');const f=$('#sheet input[type=text]');if(f&&innerWidth>900)setTimeout(()=>f.focus(),40)}
function closeModal(){$('#modal').classList.add('hidden');$('#sheet').innerHTML='';modalCb=null}
function confirmBox(title,msg,buttons,cb){modalCb=cb;openModal(`<h2>${esc(title)}</h2><p class="muted">${msg}</p><div class="acts">${buttons.map(([v,l,c])=>`<button class="btn ${c||''}" data-mres="${v}">${esc(l)}</button>`).join('')}<button class="btn" data-mres="">Cancel</button></div>`)}
function toast(t,ic){const el=$('#toast');el.innerHTML=(ic?ico(ic):'')+esc(t);el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2000)}
function burst(x,y,n,cols){cols=cols||['var(--acc)','var(--acc2)','#facc15','#fb923c','#f472b6','#34d399'];if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let k=0;k<n;k++){const s=document.createElement('i');s.className='cf';const a=Math.random()*Math.PI*2,d=40+Math.random()*(n>20?160:80);
    s.style.cssText=`left:${x}px;top:${y}px;background:${cols[k%cols.length]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-30}px;--r:${Math.random()*720-360}deg;animation-duration:${.6+Math.random()*.6}s`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}
function blockForm(b,isNew){const tpl=b.src==='tpl'||isNew;const opt=(o,v)=>o.map(([k,l])=>`<option value="${esc(k)}" ${k===v?'selected':''}>${esc(l)}</option>`).join('');
  return`<h2 style="display:flex;align-items:center;gap:10px">${isNew?ico('plus')+' Add a block':icoBox(b,34)+' Edit block'}</h2>
  ${!isNew?`<div class="muted" style="font-size:12.5px">${b.src==='extra'?'One-off block for '+esc(wLabel(ui.week)):'Repeats on the weekly timetable'+(b.changed?' · <b style="color:var(--acc)">changed this week</b>':'')+(b.cancelled?' · <b style="color:var(--bad)">cancelled this week</b>':'')}</div>`:''}
  <label class="f">Title</label><input type="text" id="f_title" value="${esc(b.title||'')}" maxlength="80">
  <div class="two"><div><label class="f">Type</label><select id="f_kind">${opt(Object.entries(KINDS),b.kind||'study')}</select></div><div><label class="f">Course</label><select id="f_course">${opt([['','— none —']].concat(S.courses.map(c=>[c.code,c.code])),b.course||'')}</select></div></div>
  <div class="three"><div><label class="f">Day</label><select id="f_day">${opt(DAYS_L.map((d,k)=>[String(k),d]),String(b.day??0))}</select></div><div><label class="f">Start</label><input type="time" id="f_s" step="900" value="${esc(b.start||'10:00')}"></div><div><label class="f">End</label><input type="time" id="f_e" step="900" value="${esc(b.end||'11:00')}"></div></div>
  <label class="f">Note</label><input type="text" id="f_note" value="${esc(b.note||'')}" maxlength="140" placeholder="Venue, lab group, due date…">
  <div class="checks" style="margin-top:14px"><label><input type="checkbox" class="ck" id="f_tent" ${b.tentative?'checked':''}> Not confirmed yet</label></div>
  ${tpl?`<label class="f">Repeats</label><select id="f_freq">${opt([['weekly','Every week'],['biweekly:0','Every other week (Week 1, 3, 5…)'],['biweekly:1','Every other week (Week 2, 4, 6…)']],b.freq==='biweekly'?'biweekly:'+(b.parity||0):'weekly')}</select>
  <label class="f">Shows in</label><div class="checks">${TYPES.map(t=>`<label><input type="checkbox" class="ck f_mode" value="${t}" ${(b.modes||[S.weeks[ui.week].type]).includes(t)?'checked':''}> ${TYPE_L[t]}</label>`).join('')}</div>`:''}
  <div class="acts">${isNew?`<button class="btn pri" data-bf="add-week">Add to this week only</button><button class="btn" data-bf="add-all">Add to every week</button>`:
    b.src==='extra'?`<button class="btn pri" data-bf="save-extra">Save</button><button class="btn danger" data-bf="del-extra">${ico('trash')} Delete</button>`:
    `<button class="btn pri" data-bf="save-week">Save for this week</button><button class="btn" data-bf="save-all">Save for every week</button>
     ${b.cancelled||b.changed?`<button class="btn" data-bf="restore">${ico('reset')} Restore usual</button>`:`<button class="btn" data-bf="cancel-week">${ico('x')} Cancel this week</button>`}
     <button class="btn danger" data-bf="del-all">${ico('trash')} Delete</button>`}<button class="btn" data-bf="close">Close</button></div>`}
function openEdit(key){const b=findKey(key,ui.week);if(!b)return;editing={key,b};openModal(blockForm(b,false))}
function openAdd(){editing={key:null};const td=todayDay(ui.week);openModal(blockForm({kind:'study',day:ui.view==='day'?ui.day:Math.max(0,td),start:'10:00',end:'11:00'},true))}
function readForm(){const v=id=>$('#'+id)?$('#'+id).value:'';
  const o={title:v('f_title').trim()||'Untitled',kind:v('f_kind'),course:v('f_course')||null,day:+v('f_day'),start:v('f_s'),end:v('f_e'),note:v('f_note').trim(),tentative:$('#f_tent').checked};
  if(!/^\d\d:\d\d$/.test(o.start)||!/^\d\d:\d\d$/.test(o.end)||toM(o.end)<=toM(o.start)){toast('End time must be after start time','clock');return null}
  if($('#f_freq')){const f=v('f_freq');o.freq=f==='weekly'?'weekly':'biweekly';o.parity=f==='biweekly:1'?1:0;o.modes=[...document.querySelectorAll('.f_mode:checked')].map(x=>x.value);if(!o.modes.length){toast('Pick at least one week type');return null}}
  return o}
const curW=()=>S.weeks[ui.week];
function applyMove(key,ch,scope){const w=curW();const[src,id]=key.split(':');
  if(src==='extra'){const x=(w.extra||[]).find(e=>e.id===id);if(x)Object.assign(x,ch);save('weeks');return}
  if(scope==='week'){w.overrides=w.overrides||{};const prev=w.overrides[id]||{};delete prev.cancelled;w.overrides[id]=Object.assign(prev,ch);save('weeks')}
  else{const t=S.blocks.find(b=>b.id===id);if(t)Object.assign(t,ch);if(w.overrides)delete w.overrides[id];save('blocks','weeks')}}
function blockAction(act){const w=curW();if(act==='close'){closeModal();return}
  const key=editing&&editing.key,[src,id]=key?key.split(':'):[];
  if(act==='restore'){delete w.overrides[id];save('weeks');closeModal();render();toast('Restored for this week','reset');return}
  if(act==='cancel-week'){w.overrides=w.overrides||{};w.overrides[id]={cancelled:true};save('weeks');closeModal();render();toast('Cancelled for this week','x');return}
  if(act==='del-extra'){w.extra=(w.extra||[]).filter(e=>e.id!==id);save('weeks');closeModal();render();return}
  if(act==='del-all'){const t=S.blocks.find(b=>b.id===id);confirmBox('Delete from timetable?',`“${esc(t?t.title:'')}” will be removed from every week. To skip it once, use “Cancel this week”.`,[['y','Delete everywhere','danger']],r=>{if(r==='y'){S.blocks=S.blocks.filter(b=>b.id!==id);S.weeks.forEach(x=>{if(x.overrides)delete x.overrides[id]});save('blocks','weeks');render()}});return}
  const o=readForm();if(!o)return;
  if(act==='add-week'){delete o.freq;delete o.parity;delete o.modes;o.id=uid('x');w.extra=w.extra||[];w.extra.push(o);save('weeks');toast('Added to '+wLabel(ui.week),'plus')}
  else if(act==='add-all'){o.id=uid('b');S.blocks.push(o);save('blocks');toast('Added to the weekly timetable','plus')}
  else if(act==='save-extra')applyMove(key,o,'week');
  else if(act==='save-week'){delete o.freq;delete o.parity;delete o.modes;applyMove(key,o,'week');toast('Changed for this week only','check')}
  else if(act==='save-all'){applyMove(key,o,'all');toast('Changed for every week','check')}
  closeModal();render()}

/* ---------- drag & drop ---------- */
let drag=null;
function dragStart(){const r=drag.el.getBoundingClientRect();drag.active=true;drag.offX=drag.x0-r.left;drag.offY=drag.y0-r.top;
  const g=drag.el.cloneNode(true);g.classList.add('ghost');Object.assign(g.style,{width:r.width+'px',height:r.height+'px',left:r.left+'px',top:r.top+'px'});document.body.appendChild(g);drag.g=g;
  const l=document.createElement('div');l.className='droplabel';document.body.appendChild(l);drag.l=l;drag.el.classList.add('dragging');try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
function dropTarget(x,y){const col=document.elementsFromPoint(x,y).find(n=>n.classList&&n.classList.contains('daycol'));if(!col)return null;
  const r=col.getBoundingClientRect(),P=ppm(),dur=toM(drag.b.end)-toM(drag.b.start);let s=H0+Math.round((y-drag.offY-r.top)/P/15)*15;s=Math.max(H0,Math.min(H1-dur,s));return{col,day:+col.dataset.day,s,e:s+dur}}
function onMove(e){if(!drag)return;const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.active){if(Math.hypot(dx,dy)>7){if(drag.touch){endDrag();return}dragStart()}else return}
  e.preventDefault();drag.g.style.left=(e.clientX-drag.offX)+'px';drag.g.style.top=(e.clientY-drag.offY)+'px';
  document.querySelectorAll('.daycol.drop').forEach(c=>c.classList.remove('drop'));const t=dropTarget(e.clientX,e.clientY);
  if(t){t.col.classList.add('drop');drag.l.style.display='block';drag.l.textContent=DAYS[t.day]+' · '+f12(t.s)+' – '+f12(t.e);drag.l.style.left=(e.clientX+16)+'px';drag.l.style.top=(e.clientY-34)+'px'}else drag.l.style.display='none'}
function endDrag(){if(!drag)return;clearTimeout(drag.timer);if(drag.g)drag.g.remove();if(drag.l)drag.l.remove();if(drag.el)drag.el.classList.remove('dragging');document.querySelectorAll('.daycol.drop').forEach(c=>c.classList.remove('drop'));drag=null;
  window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',endDrag)}
function onUp(e){if(!drag)return;const d=drag;if(!d.active){endDrag();openEdit(d.key);return}
  const t=dropTarget(e.clientX,e.clientY);endDrag();if(!t)return;
  const ch={day:t.day,start:toT(t.s),end:toT(t.e)};if(ch.day===d.b.day&&ch.start===d.b.start)return;
  const where=`${DAYS_L[t.day]} ${f12(t.s)} – ${f12(t.e)}`;
  if(d.b.src==='extra'){applyMove(d.key,ch,'week');render();toast('Moved to '+where,'check');return}
  confirmBox('Move “'+d.b.title+'”?',`New time: <b style="color:var(--ink)">${where}</b>`,[['week','Only this week','pri'],['all','Every week']],r=>{if(!r)return;applyMove(d.key,ch,r);render();toast(r==='week'?'Moved for this week only':'Moved for every week','check')})}
const V=$('#view');
V.addEventListener('pointerdown',e=>{const el=e.target.closest('.blk[data-key]');if(!el||(e.pointerType==='mouse'&&e.button!==0))return;
  const b=findKey(el.dataset.key,ui.week);if(!b)return;
  drag={el,key:el.dataset.key,b,x0:e.clientX,y0:e.clientY,active:false,touch:e.pointerType!=='mouse'};
  if(drag.touch)drag.timer=setTimeout(()=>{if(drag&&!drag.active)dragStart()},380);
  window.addEventListener('pointermove',onMove,{passive:false});window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',endDrag)});
document.addEventListener('touchmove',e=>{if(drag&&drag.active)e.preventDefault()},{passive:false});
V.addEventListener('contextmenu',e=>{if(e.target.closest('.blk'))e.preventDefault()});

  const gt=t.closest('[data-goto]');if(gt){e.preventDefault();ui.week=+gt.dataset.goto;go('timetable');return}

document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.topic){const[c,tp]=topicRef(t.dataset.topic);if(tp){tp.done=t.checked;save('courses');const it=t.closest('.item');if(it)it.classList.toggle('done',t.checked);if(t.checked){const[x,y]=boxPos(t);burst(x,y,16,[c.color,'#fff','#5eead4'])}tickRender()}return}
  if(t.dataset.move){const[c,tp]=topicRef(t.dataset.move);if(tp){tp.week=t.value;save('courses');render();toast(t.value?'Moved to '+wLabel(wIdx()[t.value]):'Unscheduled','arrow')}return}
  if(t.dataset.tpl||t.dataset.cust){const{bw}=weekTasks(ui.week);if(t.dataset.tpl)bw.done[t.dataset.tpl]=t.checked;else{const x=bw.custom.find(c=>c.id===t.dataset.cust);if(x)x.done=t.checked}
    save('tasks');const it=t.closest('.item');if(it)it.classList.toggle('done',t.checked);if(t.checked){const[x,y]=boxPos(t);burst(x,y,12);celebrateIfDone()}tickRender();return}
  if(t.dataset.wtype){S.weeks[+t.dataset.wtype].type=t.value;save('weeks');render();return}
  if(t.dataset.color){const c=course(t.dataset.color);if(c){c.color=t.value;save('courses');render()}return}
  if(t.id==='startd'&&/^\d{4}-\d\d-\d\d$/.test(t.value)){S.settings.start=t.value;save('settings');render();return}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.focus){const w=curW();w.focus=w.focus||{};w.focus[t.dataset.focus]=t.value;cacheLocal();clearTimeout(focusTimer);focusTimer=setTimeout(()=>save('weeks'),500)}});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();const v=f.t.value.trim();if(!v)return;
  if(f.dataset.form==='gtoken'){G.token=v;G.id='';connectGist(true);return}
  if(f.dataset.form==='task'){if($('#rep')&&$('#rep').checked)S.tasks.templates.push({id:uid('t'),text:v,modes:[curW().type]});else weekTasks(ui.week).bw.custom.push({id:uid('c'),text:v,done:false});save('tasks');render();const n=document.querySelector('form[data-form=task] input');if(n)n.focus()}
  if(f.dataset.form==='topic'){const c=course(f.dataset.course);c.topics.push({id:uid('u'),t:v,week:f.w.value,done:false,sug:false});save('courses');render();toast('Topic added','plus')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeModal()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==ui.tab){ui.tab=h;render(true)}});
let rz=innerWidth<900;window.addEventListener('resize',()=>{const n=innerWidth<900;if(n!==rz){rz=n;if(n&&ui.view==='week')ui.view='day';if(ui.tab==='timetable'&&!drag)render()}});

$('#logoic').innerHTML=ico('zap');$('#pw').innerHTML=ico('chevL');$('#nw').innerHTML=ico('chevR');$('#tw').innerHTML=ico('target')+'<span>Today</span>';
const h0=location.hash.slice(1);if(TABS.some(t=>t[0]===h0))ui.tab=h0;
ui.week=currentWeek();{const td=todayDay(ui.week);ui.day=td>=0?td:0}
render(true);connect();
})();
</script>
</body>
</html>
